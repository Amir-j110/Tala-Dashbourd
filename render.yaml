services:
  - type: web
    name: tala-mobile
    runtime: python
    plan: free
    buildCommand: ""
    startCommand: python server.py
    envVars:
      - key: NAVASAN_API_KEY
        sync: false
      - key: APP_ACCESS_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: NAVASAN_QUOTE_CACHE_SECONDS
        value: "14400"
      - key: NAVASAN_CANDLE_CACHE_SECONDS
        value: "86400"
